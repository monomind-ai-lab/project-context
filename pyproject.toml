[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "project-context"
version = "0.6.0"
description = "Agent-maintained Markdown context for projects and private cross-project hubs."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["agents", "context", "memory", "markdown", "obsidian", "claude", "codex"]

[project.urls]
Homepage = "https://github.com/monomind-ai-lab/project-context"

[project.scripts]
project-context = "project_context_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/project_context_cli"]

[tool.hatch.build.targets.wheel.force-include]
"skills" = "project_context_cli/_bundle/skills"
"VERSION" = "project_context_cli/_bundle/VERSION"

[tool.hatch.build.targets.sdist]
include = ["src", "skills", "prompts", "docs/context-hub-architecture.md", "VERSION", "README.md", "LICENSE"]
